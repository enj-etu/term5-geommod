name: Генерация отчёта
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  render-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Typst
        uses: typst-community/setup-typst@v5

      - run: mkdir export
      - run: mkdir fonts

      - name: Set up templates
        uses: actions/checkout@v6
        with:
          repository: 'm1raynee/typst-templates'
          path: 'report/typst-templates'
          ref: 'main'

      - name: Set up fonts
        uses: actions/checkout@v6
        with:
          repository: 'misuchiru03/font-times-new-roman'
          path: 'report/fonts'

      - name: Compile 'report.typ'
        run: typst compile --root . report/report.typ export/report.pdf --font-path report/fonts

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PDF
          path: export/
